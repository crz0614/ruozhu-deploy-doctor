name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: deploy_doctor, POSTGRES_PASSWORD: test, POSTGRES_DB: deploy_doctor_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deploy_doctor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://deploy_doctor:test@localhost:5432/deploy_doctor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23.x' }
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/diagnose
