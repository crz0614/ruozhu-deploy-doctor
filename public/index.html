<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Deploy Doctor</title><style>
:root{color-scheme:dark;font:15px Inter,system-ui;background:#080d19;color:#edf2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17254b,#080d19 42%)}main{max-width:1050px;margin:auto;padding:48px 20px}.top{display:flex;justify-content:space-between;gap:20px;align-items:start}h1{font-size:clamp(34px,6vw,62px);margin:0;letter-spacing:-.05em}h2{margin-top:0}.muted{color:#9ba8c7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.card{background:#11192b;border:1px solid #293553;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 14px 40px #0004}label{display:block;color:#bbc5dc;margin:10px 0}input,select,textarea,button{width:100%;border-radius:9px;border:1px solid #405077;background:#090f1e;color:white;padding:11px;font:inherit;margin-top:5px}textarea{min-height:130px;font-family:ui-monospace,monospace}button{border:0;background:#6b5df5;font-weight:750;cursor:pointer}.secondary{background:#293553}.danger{background:#8b3347}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#293553}.job{border-top:1px solid #293553;padding:16px 0}.job:first-child{border:0}pre{white-space:pre-wrap;word-break:break-word;background:#080d19;border-radius:9px;padding:12px;max-height:280px;overflow:auto}.notice{min-height:24px;color:#f3c76f}@media(max-width:600px){.top{display:block}main{padding-top:28px}}
</style></head><body><main><div class="top"><div><h1>Deploy Doctor</h1><p class="muted">Reproduce failures. Cite evidence. Review before every PR.</p></div><div id="identity" class="muted"></div></div><div id="notice" class="notice" role="status"></div>
<section id="auth" class="grid"><form class="card" data-auth="login"><h2>Sign in</h2><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="12" required></label><button>Sign in</button></form><form class="card" data-auth="register"><h2>Create account</h2><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="12" required></label><button>Create account</button></form></section>
<section id="app" hidden><div class="grid"><form id="diagnose" class="card"><h2>New diagnosis</h2><label>Authorized repository<select name="repo" id="repos" required><option value="">Loading repositories…</option></select></label><button>Clone and run isolated diagnosis</button></form><div class="card"><h2>Integration status</h2><div id="health" class="muted">Checking…</div><button id="logout" class="secondary">Sign out</button></div></div><section class="card"><h2>Diagnosis jobs</h2><div id="jobs" class="muted">Loading…</div></section></section>
<dialog id="review" class="card"><form method="dialog"><button class="secondary">Close</button></form><h2>Evidence and fix review</h2><pre id="events"></pre><form id="proposal"><input name="jobId" type="hidden"><label>Unified git diff<textarea name="patch" placeholder="diff --git a/... b/..." required></textarea></label><button>Verify patch</button></form></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let me=null;
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'content-type':'application/json',...options.headers}});const data=await response.json();if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);return data}
function note(message=''){ $('#notice').textContent=message }
async function session(){try{me=await api('/api/auth/me')}catch{me=null}$('#auth').hidden=!!me;$('#app').hidden=!me;$('#identity').innerHTML=me?`${esc(me.email)}<br><span class="badge">authenticated</span>`:'';if(me)await Promise.all([loadHealth(),loadRepos(),loadJobs()])}
document.querySelectorAll('[data-auth]').forEach(form=>form.onsubmit=async event=>{event.preventDefault();try{note('Working…');await api(`/api/auth/${form.dataset.auth}`,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});form.reset();note();await session()}catch(error){note(error.message)}});
async function loadHealth(){const h=await api('/api/health');$('#health').innerHTML=`Database: ${esc(h.database)}<br>GitHub: ${esc(h.github.status)}`}
async function loadRepos(){try{const repos=await api('/api/repositories');$('#repos').innerHTML='<option value="">Select a repository</option>'+repos.filter(r=>r.permissions.pull).map(r=>`<option value="${esc(r.fullName)}">${esc(r.fullName)}${r.private?' · private':''}</option>`).join('')}catch(error){$('#repos').innerHTML='<option value="">GitHub authorization unavailable</option>';note(error.message)}}
async function loadJobs(){const jobs=await api('/api/jobs');$('#jobs').innerHTML=jobs.length?jobs.map(j=>`<article class="job"><span class="badge">${esc(j.status)}</span><h3>${esc(j.repo)}</h3><p class="muted">${esc(j.framework||'Framework pending')}</p><pre>${esc(j.result?.summary||'Waiting for evidence…')}</pre><div class="grid"><button class="secondary" onclick="openReview('${j.id}')">Review evidence</button>${['queued','running'].includes(j.status)?`<button class="danger" onclick="cancelJob('${j.id}')">Cancel</button>`:''}</div></article>`).join(''):'No diagnosis jobs yet.'}
$('#diagnose').onsubmit=async event=>{event.preventDefault();try{note('Cloning repository…');await api('/api/jobs',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.target)))});note();await loadJobs()}catch(error){note(error.message)}};
async function cancelJob(id){try{await api(`/api/jobs/${id}/cancel`,{method:'POST'});await loadJobs()}catch(error){note(error.message)}}
async function openReview(id){try{const events=await api(`/api/jobs/${id}/events`);$('#events').textContent=JSON.stringify(events,null,2);$('#proposal [name=jobId]').value=id;$('#review').showModal()}catch(error){note(error.message)}}
$('#proposal').onsubmit=async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.target));try{note('Applying patch in an isolated copy and rerunning checks…');await api(`/api/jobs/${values.jobId}`,{method:'POST',body:JSON.stringify({action:'propose-fix',patch:values.patch})});event.target.reset();$('#review').close();note('Patch verified and queued for approval.')}catch(error){note(error.message)}};
$('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});await session()};session();setInterval(()=>me&&loadJobs().catch(()=>{}),3000);
</script></body></html>
